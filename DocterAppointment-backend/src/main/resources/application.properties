spring.application.name=DocterAppointment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/docters_app}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

app.jwt.secret=${JWT_SECRET:f3a9c2e7b84d1f6a0e5c9b2d7f4a8e3c1b6d9f2a5e8c3b7d0f4a9e2c6b1d8f5}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
server.port=${PORT:8080}
